name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  web:
    name: Check web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          # 22+ recognises ES module syntax in plain .js files.
          node-version: 22
      - name: Syntax check
        run: |
          # The web app has no build step; make sure every module at least parses. Parsed from
          # stdin as modules, since `node --check file.js` can pass a broken file it can't classify.
          find web/js web/dev tools -name '*.js' -o -name '*.mjs' | while read -r file; do
            node --input-type=module --check < "$file" || { echo "::error file=$file::Syntax error"; exit 1; }
          done
          echo "$(find web/js -name '*.js' | wc -l) web modules OK"

  package:
    name: Package (${{ matrix.configuration }})
    needs: web
    runs-on: windows-2022
    permissions:
      contents: write # publish releases for version tags
    strategy:
      fail-fast: false
      matrix:
        # Release is the one to install. Debug skips .NET Native, which helps tell a
        # compiler problem from an app problem if a Release build misbehaves.
        configuration: [Release, Debug]

    steps:
      - uses: actions/checkout@v6

      - uses: microsoft/setup-msbuild@v3

      - name: Set package version
        shell: pwsh
        run: |
          $manifest = Resolve-Path 'Nuvio\Package.appxmanifest'
          [xml]$xml = Get-Content $manifest -Raw
          # Major and minor from the manifest, then the run number: always increasing, so a newer
          # build installs over an older one. Local builds keep 0 there, which the app treats as a
          # developer build that doesn't look for updates.
          $base = [version]$xml.Package.Identity.Version
          $version = "$($base.Major).$($base.Minor).$env:GITHUB_RUN_NUMBER.0"
          $xml.Package.Identity.Version = $version
          $xml.Save($manifest)
          "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV
          "Version: $version"

      - name: Create signing certificate
        shell: pwsh
        run: |
          # Self-signed, subject must match Publisher in Package.appxmanifest.
          $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=NuvioUWP' `
            -KeyUsage DigitalSignature -FriendlyName 'Nuvio UWP sideload' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          "CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - name: Add build settings
        # Optional repository secrets, written into web/js/config.local.js (never committed):
        # NUVIO_PUBLISHABLE_KEY builds in a Nuvio server to sign in to (NUVIO_BACKEND_URL,
        # default https://api.nuvio.tv), TMDB_API_KEY a TMDB key for artwork and cast, and
        # TRAKT_CLIENT_ID + TRAKT_CLIENT_SECRET the Trakt API app to connect Trakt with.
        shell: pwsh
        env:
          NUVIO_PUBLISHABLE_KEY: ${{ secrets.NUVIO_PUBLISHABLE_KEY }}
          NUVIO_BACKEND_URL: ${{ secrets.NUVIO_BACKEND_URL }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
        run: |
          $config = [ordered]@{}
          if ($env:NUVIO_PUBLISHABLE_KEY) {
            $url = if ($env:NUVIO_BACKEND_URL) { $env:NUVIO_BACKEND_URL } else { 'https://api.nuvio.tv' }
            $config.officialServer = [ordered]@{ backendUrl = $url; publishableKey = $env:NUVIO_PUBLISHABLE_KEY }
          }
          if ($env:TMDB_API_KEY) { $config.tmdbApiKey = $env:TMDB_API_KEY }
          if ($env:TRAKT_CLIENT_ID -and $env:TRAKT_CLIENT_SECRET) {
            $config.trakt = [ordered]@{ clientId = $env:TRAKT_CLIENT_ID; clientSecret = $env:TRAKT_CLIENT_SECRET }
          }
          if ($config.Count) {
            "export default $($config | ConvertTo-Json -Compress -Depth 3);" | Set-Content web\js\config.local.js -Encoding utf8
            "Build settings added: $($config.Keys -join ', ')"
          } else {
            'No build settings: sign-in uses a server chosen in the app.'
          }

      - name: Build package
        shell: pwsh
        run: >
          msbuild Nuvio\Nuvio.csproj -restore -m -nologo -v:minimal
          /p:Configuration=${{ matrix.configuration }}
          /p:Platform=x64
          /p:AppxBundle=Never
          /p:UapAppxPackageBuildMode=SideloadOnly
          /p:GenerateAppxPackageOnBuild=true
          /p:AppxAutoIncrementPackageRevision=false
          /p:AppxPackageDir=$env:GITHUB_WORKSPACE\AppPackages\
          /p:AppxPackageSigningEnabled=true
          /p:PackageCertificateThumbprint=$env:CERT_THUMBPRINT

      - name: Verify package
        shell: pwsh
        run: |
          # Fail the build if VLC, its runtime or the web app didn't make it into the package, and
          # publish a summary as an annotation so it can be read without downloading the artifact.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $msix = Get-ChildItem AppPackages -Recurse -Include *.msix, *.appx |
            Where-Object { $_.Directory.Parent.Name -ne 'Dependencies' } | Select-Object -First 1
          if (-not $msix) { throw 'No package was produced.' }
          $zip = [IO.Compression.ZipFile]::OpenRead($msix.FullName)
          try {
            $entries = $zip.Entries | ForEach-Object { $_.FullName }
            $reader = New-Object IO.StreamReader(($zip.Entries | Where-Object FullName -eq 'AppxManifest.xml').Open())
            [xml]$manifest = $reader.ReadToEnd()
            $reader.Close()
          } finally { $zip.Dispose() }
          $dependencies = $manifest.Package.Dependencies.PackageDependency | ForEach-Object { $_.Name }
          $plugins = @($entries | Where-Object { $_ -like 'plugins/*.dll' }).Count
          $webFiles = @($entries | Where-Object { $_ -like 'web/*' }).Count
          $sizeMb = [math]::Round($msix.Length / 1MB, 1)
          $summary = "$($msix.Name) ($sizeMb MB): $plugins VLC plugins, $webFiles web app files; depends on $($dependencies -join ', ')"
          "::notice title=Package (${{ matrix.configuration }})::$summary"
          # Managed DLLs are compiled into Nuvio.dll by .NET Native in Release, so only check native ones.
          $missing = @('libvlc.dll', 'libvlccore.dll', 'web/index.html', 'web/js/main.js', 'web/css/app.css') | Where-Object { $entries -notcontains $_ }
          if ($missing) { throw "Missing from package: $($missing -join ', ')" }
          if ($plugins -lt 50) { throw "Only $plugins VLC plugins were packaged." }
          if ($dependencies -notcontains 'Microsoft.VCLibs.140.00') { throw 'Package does not depend on Microsoft.VCLibs.140.00 (needed by libvlc).' }
          Get-ChildItem AppPackages -Recurse -File | ForEach-Object { $_.FullName.Substring($PWD.Path.Length + 1) }

      - uses: actions/upload-artifact@v6
        with:
          name: Nuvio-VLC-x64-${{ matrix.configuration }}
          path: AppPackages/
          if-no-files-found: error

      - name: Collect install files
        # Only what's needed to install: the app at the top, its 5 x64 dependency packages in Dependencies.
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          $test = Get-ChildItem AppPackages -Directory -Filter '*_Test' | Select-Object -First 1
          $app = @(Get-ChildItem $test.FullName -Filter *.msix)
          $dependencies = @(Get-ChildItem (Join-Path $test.FullName 'Dependencies\x64') -Filter *.appx)
          if ($app.Count -ne 1 -or $dependencies.Count -ne 5) {
            throw "Expected the app and 5 dependencies, found: $(($app + $dependencies).Name -join ', ')"
          }
          New-Item -ItemType Directory release\Dependencies -Force | Out-Null
          $app | Copy-Item -Destination release
          $dependencies | Copy-Item -Destination release\Dependencies
          Get-ChildItem release -Recurse -File | ForEach-Object { $_.FullName.Substring($PWD.Path.Length + 1) }

      - uses: actions/upload-artifact@v6
        # The same layout as a release, for every build: download it from the run's Artifacts.
        if: matrix.configuration == 'Release'
        with:
          name: NuvioUWPVLC-x64
          path: release/
          if-no-files-found: error

      - name: Publish release
        # Push a tag such as v1.0.0 to publish the Release build on the repository's Releases page.
        if: github.ref_type == 'tag' && matrix.configuration == 'Release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $parts = $env:PACKAGE_VERSION.Split('.')
          if ($tag -match '^v(\d+)\.(\d+)' -and "$($Matches[1]).$($Matches[2])" -ne "$($parts[0]).$($parts[1])") {
            throw "Tag $tag doesn't match version $($parts[0]).$($parts[1]) in Nuvio\Package.appxmanifest. Update the manifest's Version and tag again."
          }
          Compress-Archive -Path release\* -DestinationPath NuvioUWPVLC-x64.zip
          # The app reads "What's new" and "Package version" from these notes for its update notice.
          $changes = [regex]::Match((Get-Content CHANGELOG.md -Raw -Encoding utf8), '(?ms)^## ' + [regex]::Escape($tag) + '[ \t]*\r?\n(.*?)(?=^## |\z)')
          $notes = @("Nuvio for Xbox Developer Mode with VLC built in.", '')
          if ($changes.Success) { $notes += @("## What's new", $changes.Groups[1].Value.Trim(), '') }
          $notes += @(
            '## Install',
            'Download **NuvioUWPVLC-x64.zip** and unzip it. It contains the app (.msix) and a Dependencies folder with the 5 dependency packages (.appx).',
            'Install steps are in the README: upload the .msix in the Xbox Device Portal, then add the 5 files from Dependencies. Installing over an earlier version keeps your sign-in and data.',
            '',
            "Package version: $($parts[0..2] -join '.')")
          $notes -join "`n" | Set-Content release-notes.md -Encoding utf8
          Get-Content release-notes.md
          # Re-running the workflow (e.g. after adding a secret) updates the existing release.
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag NuvioUWPVLC-x64.zip --clobber
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            gh release edit $tag --notes-file release-notes.md
          } else {
            gh release create $tag NuvioUWPVLC-x64.zip --title "Nuvio UWP VLC $tag" --notes-file release-notes.md
          }
